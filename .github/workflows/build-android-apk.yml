name: Build ASKR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - alpha/android-apk-packaging
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'capacitor.config.*'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ASKR-1.0.0-alpha.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASKR-1.0.0-alpha.1-android
          path: release/ASKR-1.0.0-alpha.1.apk
          if-no-files-found: error
          retention-days: 30
